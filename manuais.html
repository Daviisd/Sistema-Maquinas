<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manuais das Máquinas</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="cabecalho">

        <img src="img/logo.png" alt="Logo" class="logo">

        <div class="titulo">

            <h1>Sistema de Máquinas</h1>

            <p>Portal de Manuais Técnicos</p>

        </div>

    </div>

    <nav>

        <a href="index.html">🏠 Início</a>

        <a href="maquinas.html">🖥️ Máquinas</a>

        <a href="manuais.html">📚 Manuais</a>

        <a href="manutencoes.html">🔧 Manutenção</a>

        <a href="cadastro-manual.html" id="menuCadastrarManual">
            ➕ Cadastrar Manual
        </a>

        <a href="#" id="menuLogout">
            🚪 Sair
        </a>

    </nav>

</header>

<main class="container">

    <section class="pesquisa">

        <h2>Pesquisar Manual</h2>

        <input
            type="text"
            id="campoPesquisa"
            placeholder="Digite o nome do manual ou da máquina">

    </section>

    <section class="maquinas">

        <h2>Manuais Cadastrados</h2>

        <div id="listaManuais"></div>

    </section>

</main>

<footer>

    Sistema de Máquinas © 2026

</footer>

<script src="js/manuais.js"></script>

<script>

const perfil = localStorage.getItem("perfil");

if(perfil !== "instrutor"){

    const menu = document.getElementById("menuCadastrarManual");

    if(menu){

        menu.style.display = "none";

    }

}

const logout = document.getElementById("menuLogout");

logout.addEventListener("click", function(e){

    e.preventDefault();

    localStorage.clear();

    window.location.href = "login.html";

});

</script>

</body>

</html>
