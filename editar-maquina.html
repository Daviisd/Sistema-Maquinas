<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Máquina</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="cabecalho">

        <img src="img/logo.png" class="logo">

        <div class="titulo">

            <h1>Editar Máquina</h1>

            <p>Atualize as informações do equipamento</p>

        </div>

    </div>

</header>

<main>

<div class="form-container">

<form id="formEditar">

    <h2>Informações da Máquina</h2>

    <label>Nome da Máquina</label>

    <input
        type="text"
        id="nome"
        required>

    <label>Fabricante</label>

    <input
        type="text"
        id="fabricante">

    <label>Modelo</label>

    <input
        type="text"
        id="modelo">

    <label>Localização</label>

    <input
        type="text"
        id="localizacao">

    <label>Status</label>

    <select id="status">

        <option>Disponível</option>

        <option>Em manutenção</option>

        <option>Interditada</option>

    </select>

    <label>Descrição</label>

    <textarea
        id="descricao"
        rows="6"></textarea>

    <button type="submit">

        Salvar Alterações

    </button>

</form>

</div>

</main>

<script src="js/editar-maquina.js"></script>

</body>

</html>
