<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="cabecalho">

        <img src="img/logo.png" class="logo">

        <div class="titulo">

            <h1>Sistema de Máquinas</h1>

            <p>Cadastro de Usuários</p>

        </div>

    </div>

</header>

<main class="form-container">

    <h1>Novo Usuário</h1>

    <form id="formUsuario">

        <div class="secao">

            <div class="linha">

                <div class="campo">

                    <label>Nome</label>

                    <input
                        type="text"
                        id="nome"
                        required>

                </div>

                <div class="campo">

                    <label>Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        required>

                </div>

            </div>

            <div class="linha">

                <div class="campo">

                    <label>Senha</label>

                    <input
                        type="password"
                        id="senha"
                        required>

                </div>

                <div class="campo">

                    <label>Perfil</label>

                    <select id="perfil">

                        <option value="aluno">Aluno</option>

                        <option value="instrutor">Instrutor</option>

                    </select>

                </div>

            </div>

        </div>

        <div class="botoes">

            <button type="submit">

                Cadastrar Usuário

            </button>

        </div>

    </form>

</main>

<script src="js/cadastro-usuario.js"></script>

</body>

</html>
